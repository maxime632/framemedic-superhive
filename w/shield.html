<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<link rel="icon" href="data:,"><title>Frame Medic · Crash Shield</title>
<link rel="stylesheet" href="w.css">
<style>
.w{flex-direction:row;align-items:stretch}
.mod{flex:1.3;min-width:0;background:var(--s1);display:flex;flex-direction:column;border-left:3px solid var(--s3);transition:border-color .3s}
.mh{display:flex;align-items:center;gap:8px;font-size:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.mh i{width:12px;height:12px;background:#3d8bff}
.mh span{margin-left:auto;color:var(--mute);font-size:11px}
.row{padding:14px 14px 0}
.lab{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--soft)}
.val{font:700 15px/1 SM,"Space Mono",Menlo,monospace;color:#fff;background:var(--s3);padding:7px 9px 6px;min-width:112px;text-align:right;transition:background .3s,color .3s}
.held .val{background:var(--lime);color:#141414}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;margin-top:8px;cursor:pointer;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:6px;background:var(--s3)}
input[type=range]::-moz-range-track{height:6px;background:var(--s3)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:24px;margin-top:-9px;background:#fff;border:0}
input[type=range]::-moz-range-thumb{width:18px;height:24px;background:#fff;border:0;border-radius:0}
.res{padding:6px 14px 26px;margin-top:auto}
.meter{position:relative;height:12px;background:var(--s3);margin:8px 0 6px}
.meter i{display:block;height:100%;width:0;background:var(--soft);transition:width .15s,background .2s}
.meter.over i{background:var(--pink)}
.held .meter i{background:var(--lime)}
.lim{position:absolute;top:-5px;bottom:-5px;width:2px;background:#fff}
.lim small{position:absolute;top:21px;left:50%;transform:translateX(-50%);font:700 10px/1 SM,"Space Mono",Menlo,monospace;color:var(--mute);white-space:nowrap}
.faces{display:flex;justify-content:space-between;font-size:12px;color:var(--mute)}
.faces b{font:700 16px/1 SM,"Space Mono",Menlo,monospace;color:#fff}
.side{flex:1;min-width:0;margin-left:16px;display:flex;flex-direction:column;justify-content:center}
.hint{font-size:13px;color:var(--mute);line-height:1.5}
.hint b{color:var(--txt)}
.toast{display:flex;gap:12px;background:#1b1b1b;border:1px solid #3a3a3a;border-left:4px solid var(--lime);padding:12px 12px 12px 14px;
 transform:translateY(12px);opacity:0;pointer-events:none;transition:transform .35s var(--e),opacity .35s}
.toast.on{transform:none;opacity:1;pointer-events:auto}
.toast svg{flex:none;width:12px;height:15px;color:var(--lime);margin-top:2px}
.toast b{display:block;font-size:13.5px;line-height:1.3}
.toast p{font-size:12px;line-height:1.4;color:var(--soft);margin-top:4px}
.toast button{align-self:flex-end;flex:none;font:700 11px/1 SM,"Space Mono",Menlo,monospace;letter-spacing:.06em;color:#141414;background:var(--lime);padding:9px 10px 8px;min-height:32px}
.held .mod{border-left-color:var(--lime)}
.side .hint{transition:opacity .3s}.held .side .hint{display:none}
@media (max-width:559px){
 .w{flex-direction:column}
 .mh{padding:9px 11px}.row{padding:10px 11px 0}.res{padding:4px 11px 22px}
 .val{min-width:98px;font-size:13px}
 .side{position:absolute;left:14px;right:14px;bottom:14px;margin:0}
 .held .res{visibility:hidden}
 .side .hint{display:none}
 .toast{padding:9px 9px 9px 11px}.toast b{font-size:12.5px}.toast p{font-size:11px}
}
</style></head>
<body>
<div class="w" id="w">
  <div class="mod" id="mod">
    <div class="mh m"><i></i>REMESH<span>VOXEL</span></div>
    <div class="row">
      <div class="lab"><label for="vx">Voxel Size</label><span class="val" id="fv">0.0100 m</span></div>
      <input type="range" id="vx" min="0" max="1000" value="0" aria-label="Voxel size, smaller makes more faces">
    </div>
    <div class="res">
      <div class="faces"><span>Result</span><span><b id="nf">0.0</b> M faces</span></div>
      <div class="meter" id="meter"><i id="bar"></i><span class="lim" id="lim"><small>LIMIT 64 M</small></span></div>
    </div>
  </div>
  <div class="side">
    <p class="hint">Drag the voxel size down. <b>A value that would freeze Blender is held before Blender computes it.</b></p>
    <div class="toast" id="toast" role="status">
      <svg viewBox="0 0 5 6" aria-hidden="true"><path fill="currentColor" d="M1 0h3v3H1zM2 4h1v2H2z"/></svg>
      <div><b id="tb"></b><p id="tp"></p></div>
      <button id="allow">ALLOW</button>
    </div>
  </div>
</div>
<script src="w.js"></script>
<script>
// a real case on River 7: a Remesh at 0.0001 m on a decal, about 106 million faces; faces ~ 1 / voxel^2 from there
// the limit is a million faces per GB of memory (8 to 64 million): 64 M on that PC
const $ = id => document.getElementById(id), w = $('w');
const LIMIT = 64e6, VMAX = 0.01, VMIN = 0.0001;
const faces = v => 1.06e6 * Math.pow(0.001 / v, 2);
const vAt = s => VMAX * Math.pow(VMIN / VMAX, s / 1000);
const held = 0.001 * Math.sqrt(1.06e6 / LIMIT);
const fmtV = v => v >= 0.001 ? v.toFixed(4) : v.toFixed(5);
const pos = f => Math.min(100, Math.max(0, Math.log10(Math.max(f, 1e4) / 1e4) / Math.log10(2e8 / 1e4) * 100));
$('lim').style.left = pos(LIMIT) + '%';
let allowed = false, auto = true;
function show(v) {
  const f = faces(v), hold = !allowed && f > LIMIT, shown = hold ? faces(held) : f;
  $('fv').textContent = fmtV(hold ? held : v) + ' m';
  $('nf').textContent = (shown / 1e6).toFixed(shown < 1e7 ? 1 : 0);
  $('bar').style.width = pos(shown) + '%';
  $('meter').classList.toggle('over', !hold && f > LIMIT);
  w.classList.toggle('held', hold);
  if (hold) {
    $('tb').textContent = `Crash Shield: Remesh held at ${fmtV(held)} m`;
    $('tp').textContent = `${fmtV(v)} would make about ${Math.round(f / 1e6)} million faces · Safety section: Allow`;
  }
  $('toast').classList.toggle('on', hold);
}
$('vx').addEventListener('input', e => { auto = false; show(vAt(+e.target.value)); });
$('allow').onclick = () => {
  allowed = true; $('toast').classList.remove('on'); w.classList.remove('held'); $('fv').textContent = 'ALLOWED';
  setTimeout(() => { allowed = false; $('vx').value = 0; show(VMAX); }, 2200);
};
show(VMAX);
let seen = false;
W.view(w, v => {
  if (!v || seen) return;
  seen = true;
  // drag it once by itself, down to 0.0001, so the shield shows
  const t0 = performance.now() + 900, dur = 1800;
  const step = now => {
    if (!auto) return;
    const t = Math.min(1, Math.max(0, (now - t0) / dur));
    $('vx').value = Math.round(1000 * W.ease(t)); show(vAt(+$('vx').value));
    if (t < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
});
</script>
</body></html>
