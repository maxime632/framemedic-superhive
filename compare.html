<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<title>Frame Medic · Blender alone vs Frame Medic</title>
<link rel="preload" href="fonts/Panchang-Extrabold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/fm.css">
<style>
.panel{--h:73.4rem;padding:2.4rem}
.h{font-size:2.6rem}
.bar{display:flex;align-items:center;margin-top:1.6rem}
.seg{display:flex;gap:.4rem}
.seg+.seg{margin-left:auto}
.seg button{font:700 1.3rem/1 "SM",monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);background:rgba(255,255,255,.06);padding:1.1rem 1.5rem 1rem;
 clip-path:polygon(.6rem 0,100% 0,100% calc(100% - .6rem),calc(100% - .6rem) 100%,0 100%,0 .6rem);transition:background .2s,color .2s}
.seg button:hover{background:rgba(255,255,255,.12);color:#fff}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink)}
.nums{display:flex;justify-content:space-between;align-items:center;margin-top:1.6rem;height:4.4rem}
.num{display:flex;align-items:center;gap:1rem}
.num b{font:700 3.8rem/1 "SM",monospace;letter-spacing:-.02em}
.num small{font:700 1.4rem/1 "SM",monospace;color:var(--mute);align-self:flex-end;margin-bottom:.5rem}
.num.a b{color:var(--pink)}
.num.b b{color:var(--lime)}
.num.b b,.num.b small{transition:opacity .4s}
.panel:not(.healed) .num.b b,.panel:not(.healed) .num.b small{opacity:.2}
.x{font:700 1.8rem/1 "SM",monospace;color:var(--ink);background:var(--lime);padding:.6rem .8rem .5rem;transform:scale(0);transition:transform .5s var(--spring)}
.healed .x{transform:none}
.stage{position:relative;margin-top:1.2rem;width:78.4rem;height:45.6rem;background:#000;overflow:hidden;touch-action:pan-y;
 clip-path:polygon(1.2rem 0,100% 0,100% calc(100% - 1.2rem),calc(100% - 1.2rem) 100%,0 100%,0 1.2rem)}
.healed .stage{cursor:ew-resize}
.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.alone{position:absolute;inset:0;will-change:clip-path}
.div{position:absolute;top:0;bottom:0;width:0;z-index:5;pointer-events:none;transition:opacity .3s}
.panel:not(.healed) .div{opacity:0}
.div::before{content:"";position:absolute;top:0;bottom:0;left:-.15rem;width:.3rem;background:var(--lime);box-shadow:0 0 1.6rem rgba(206,255,5,.6)}
.knob{position:absolute;top:50%;left:-2.4rem;width:4.8rem;height:4.8rem;margin-top:-2.4rem;background:var(--lime);color:var(--ink);pointer-events:auto;cursor:ew-resize;
 display:flex;align-items:center;justify-content:center;clip-path:polygon(.9rem 0,100% 0,100% calc(100% - .9rem),calc(100% - .9rem) 100%,0 100%,0 .9rem)}
.panel:not(.healed) .knob{pointer-events:none}
.knob svg{width:2.6rem;height:2.6rem}
.knob:focus-visible{outline:.3rem solid #fff;outline-offset:-.6rem}
.hint{position:absolute;top:50%;z-index:7;transform:translate(3.4rem,-50%);font:700 1.2rem/1 "SM",monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);background:#fff;padding:.8rem 1rem .7rem;
 opacity:0;transition:opacity .4s;pointer-events:none;white-space:nowrap}
.hint.on{opacity:1}
.intro{position:absolute;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;background:rgba(20,20,20,.3);transition:opacity .4s}
.healed .intro{opacity:0;pointer-events:none}
.intro .pbtn{font-size:1.8rem;padding:1.7rem 2.4rem 1.6rem}
.scan{position:absolute;top:0;bottom:0;width:14rem;z-index:6;pointer-events:none;opacity:0;
 background:linear-gradient(90deg,rgba(206,255,5,0),rgba(206,255,5,.35) 70%,rgba(206,255,5,.9));mix-blend-mode:screen}
.ctrl{display:flex;align-items:center;gap:1.2rem;margin-top:1.2rem}
.play{flex:none;width:4rem;height:4rem;background:var(--s2);display:flex;align-items:center;justify-content:center;clip-path:polygon(.7rem 0,100% 0,100% calc(100% - .7rem),calc(100% - .7rem) 100%,0 100%,0 .7rem)}
.play:hover{background:var(--s3)}
.play svg{width:1.6rem;height:1.6rem}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:.6rem;background:var(--s2);outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:1.4rem;height:1.8rem;background:var(--lime);border:0}
input[type=range]::-moz-range-thumb{width:1.4rem;height:1.8rem;background:var(--lime);border:0;border-radius:0}
.again{flex:none;font:700 1.25rem/1 "SM",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);padding:1.1rem 1.4rem 1rem;background:rgba(255,255,255,.06)}
.again:hover{color:#fff;background:rgba(255,255,255,.12)}
.foot{margin-top:1.2rem}
</style>
</head>
<body>
<div class="panel" id="p">
  <h1 class="h reveal">Blender alone vs <span class="hl">Frame Medic</span></h1>
  <div class="bar reveal d1">
    <div class="seg" id="shots"><button aria-pressed="true" data-v="sing-cam">Singularity</button><button aria-pressed="false" data-v="sing-orbit">Singularity · orbit</button><button aria-pressed="false" data-v="charge-orbit">Charge · orbit</button></div>
  </div>
  <div class="nums">
    <div class="num a"><span class="chip pink">Blender alone</span><b id="nA">1.6</b><small>fps</small></div>
    <div class="num b"><span class="x" id="nX">×12</span><b id="nB">20.0</b><small>fps</small><span class="chip lime">Frame Medic</span></div>
  </div>
  <div class="stage" id="stage">
    <video id="vB" muted playsinline loop preload="auto" aria-label="With Frame Medic"></video>
    <div class="alone" id="wrapA"><video id="vA" muted playsinline loop preload="auto" aria-label="Blender alone"></video></div>
    <div class="scan" id="scan"></div>
    <div class="div" id="div"><span class="knob" id="knob" tabindex="0" role="slider" aria-label="Move the divider between Blender alone and Frame Medic" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50">
      <svg viewBox="0 0 26 26" aria-hidden="true"><path d="M9 6 2 13l7 7M17 6l7 7-7 7" fill="none" stroke="currentColor" stroke-width="3.2"/></svg></span>
      <span class="hint" id="hint">Drag</span></div>
    <div class="intro" id="intro">
      <span class="pulse"><button class="pbtn" id="heal" data-g="Heal This Scene"><svg class="px" viewBox="0 0 3 3" aria-hidden="true"><path fill="currentColor" d="M1 0h1v1h1v1H2v1H1V2H0V1h1z"/></svg>Heal This Scene</button></span>
    </div>
  </div>
  <div class="ctrl">
    <button class="play" id="play" aria-label="Pause"><svg viewBox="0 0 16 16" aria-hidden="true" id="playIco"><path fill="currentColor" d="M3 2h4v12H3zM9 2h4v12H9z"/></svg></button>
    <input type="range" id="seek" min="0" max="10" step="0.01" value="0" aria-label="Time">
    <button class="again" id="again">↻ Again</button>
  </div>
  <p class="foot" id="foot">Real recordings on Windows · fps measured without recording · shots: Blender Studio, CC BY</p>
</div>
<script src="assets/fm.js"></script>
<script>
// a = Blender alone, b = after Heal This Scene: pictures per second in Blender, Frame Dropping playback, no recording running
const SHOTS = {'sing-cam': {a: 1.64, b: 20.03}, 'sing-orbit': {a: 1.64, b: 20.03}, 'charge-orbit': {a: 1.19, b: 19.61}};
const $ = id => document.getElementById(id);
const P = $('p'), stage = $('stage'), vA = $('vA'), vB = $('vB'), wrapA = $('wrapA'), div = $('div'), knob = $('knob');
let shot = 'sing-cam', pos = 1, healed = false, dragging = false, playing = true, seeking = false, anim = null;
const f1 = v => v.toFixed(1);

function setPos(p) {
  pos = Math.max(0, Math.min(1, p));
  wrapA.style.clipPath = `inset(0 ${((1 - pos) * 100).toFixed(3)}% 0 0)`;
  div.style.left = (pos * 100) + '%';
  knob.setAttribute('aria-valuenow', Math.round(pos * 100));
}
function nums(animate) {
  const s = SHOTS[shot];
  $('nA').textContent = f1(s.a);
  $('nX').textContent = '×' + Math.floor(s.b / s.a);
  if (animate) FM.count($('nB'), s.a, s.b, 1300, 1); else $('nB').textContent = f1(s.b);
}
function load() {
  const f = `media/${shot}`;
  vA.poster = `${f}-alone.jpg`; vB.poster = `${f}-heal.jpg`;
  vA.src = `${f}-alone.mp4`; vB.src = `${f}-heal.mp4`;
  vA.load(); vB.load(); nums(false);
  if (playing) { vA.play().catch(() => {}); vB.play().catch(() => {}); }
}
function seg(id, set) {
  $(id).querySelectorAll('button').forEach(b => b.onclick = () => {
    $(id).querySelectorAll('button').forEach(o => o.setAttribute('aria-pressed', o === b));
    set(b.dataset.v); load();
  });
}
seg('shots', v => shot = v);

// keep both recordings on the same moment (loose: a small drift is invisible, constant seeking is not)
function tick() {
  if (!vB.paused && !seeking && vA.readyState > 1 && Math.abs(vA.currentTime - vB.currentTime) > 0.25) vA.currentTime = vB.currentTime;
  if (!seeking) $('seek').value = vB.currentTime;
  requestAnimationFrame(tick);
}
$('seek').addEventListener('input', e => { seeking = true; vA.currentTime = vB.currentTime = +e.target.value; });
$('seek').addEventListener('change', () => { seeking = false; });
vB.addEventListener('loadedmetadata', () => { $('seek').max = vB.duration.toFixed(2); });
function setPlaying(on) {
  playing = on;
  $('play').setAttribute('aria-label', on ? 'Pause' : 'Play');
  $('playIco').innerHTML = on ? '<path fill="currentColor" d="M3 2h4v12H3zM9 2h4v12H9z"/>' : '<path fill="currentColor" d="M3 2l11 6-11 6z"/>';
  if (on) { vA.play().catch(() => {}); vB.play().catch(() => {}); } else { vA.pause(); vB.pause(); }
}
$('play').onclick = () => setPlaying(!playing);

function animTo(to, dur, cb) {
  cancelAnimationFrame(anim);
  const from = pos, t0 = performance.now(), sc = $('scan');
  const step = now => {
    const t = dur ? Math.min(1, (now - t0) / dur) : 1;
    setPos(from + (to - from) * FM.ease(t));
    sc.style.opacity = t < 1 ? 1 : 0; sc.style.left = `calc(${pos * 100}% - 14rem)`;
    if (t < 1) anim = requestAnimationFrame(step); else cb && cb();
  };
  anim = requestAnimationFrame(step);
}
function heal() {
  if (healed) return;
  healed = true; P.classList.add('healed');
  setPos(1); nums(true);
  const r = stage.getBoundingClientRect();
  FM.burst(document.body, r.left + r.width / 2, r.top + r.height / 2, 14);
  animTo(0.5, FM.reduce ? 0 : 1400, () => { $('hint').classList.add('on'); setTimeout(() => $('hint').classList.remove('on'), 2600); });
}
$('heal').onclick = heal;
$('again').onclick = () => { cancelAnimationFrame(anim); healed = false; P.classList.remove('healed'); setPos(1); nums(false); setTimeout(heal, 1600); };

// once healed, drag anywhere on the picture
const fromEvent = e => { const r = stage.getBoundingClientRect(); return (e.clientX - r.left) / r.width; };
stage.addEventListener('pointerdown', e => {
  if (!healed) return;
  dragging = true; stage.setPointerCapture(e.pointerId); cancelAnimationFrame(anim); setPos(fromEvent(e));
});
stage.addEventListener('pointermove', e => { if (dragging) setPos(fromEvent(e)); });
['pointerup', 'pointercancel'].forEach(t => stage.addEventListener(t, () => { dragging = false; }));
knob.addEventListener('keydown', e => {
  const d = e.key === 'ArrowLeft' ? -0.05 : e.key === 'ArrowRight' ? 0.05 : 0;
  if (d) { cancelAnimationFrame(anim); setPos(pos + d); e.preventDefault(); }
});

setPos(1); load();
requestAnimationFrame(tick);
// starts when the frame is on screen; heals by itself if nobody presses
FM.onView(P, () => {
  P.classList.add('in'); setPlaying(true);
  setTimeout(() => { if (!healed) heal(); }, 3500);
});
</script>
</body>
</html>
