<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<title>Frame Medic · Heal This Scene</title>
<link rel="preload" href="fonts/Panchang-Extrabold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/fm.css">
<style>
.panel{--h:46.8rem;padding:2.8rem}
.main{display:flex;gap:2.4rem;margin-top:2.2rem;align-items:flex-start}
.view{position:relative;flex:0 0 46rem;height:26.8rem;background:#000;overflow:hidden;
 clip-path:polygon(1.2rem 0,100% 0,100% calc(100% - 1.2rem),calc(100% - 1.2rem) 100%,0 100%,0 1.2rem)}
.view video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .6s}
#vH{opacity:0}.done #vH{opacity:1}
.read{position:absolute;right:1rem;bottom:1rem;z-index:3;background:rgba(20,20,20,.88);padding:1rem 1.2rem;
 clip-path:polygon(.7rem 0,100% 0,100% calc(100% - .7rem),calc(100% - .7rem) 100%,0 100%,0 .7rem)}
.read b{display:block;font:700 3.4rem/1 "SM",monospace;color:var(--pink);transition:color .4s}
.read b small{font-size:1.3rem;color:var(--mute);margin-left:.4rem}
.done .read b{color:var(--lime)}
.scanline{position:absolute;left:0;right:0;height:.4rem;top:0;z-index:2;background:var(--lime);box-shadow:0 0 2rem var(--lime);opacity:0}
.scanning .scanline{opacity:.85;animation:scan 1.1s linear infinite}
@keyframes scan{from{top:0}to{top:100%}}
.side{flex:1;display:flex;flex-direction:column}
.side .pulse{display:block}
.side .pbtn{width:100%;justify-content:center;font-size:1.7rem;padding:1.6rem}
.side .pbtn[disabled]{background:var(--s2);color:var(--mute);cursor:default}
.steps{margin-top:1.8rem;display:flex;flex-direction:column;gap:1.3rem}
.st{padding:.1rem 0 .1rem 1.4rem;border-left:.3rem solid var(--s3);transition:border-color .3s}
.st b{display:flex;align-items:baseline;gap:.8rem;font:700 1.8rem/1.2 "SG";color:#8f8f8f;transition:color .3s}
.st b em{font:700 1.2rem/1 "SM",monospace;font-style:normal;color:var(--mute)}
.st .res{font:700 1.3rem/1.2 "SM",monospace;letter-spacing:.04em;color:var(--lime);text-transform:uppercase;margin-top:.5rem;opacity:0;transform:translateY(.4rem);transition:all .35s var(--ease)}
.st.on{border-color:var(--pink)}.st.on b{color:#fff}
.st.ok{border-color:var(--lime)}.st.ok b{color:#fff}.st.ok .res{opacity:1;transform:none}
.again{margin-top:1.4rem;align-self:flex-start;font:700 1.2rem/1 "SM",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);padding:1rem 1.2rem .9rem;background:rgba(255,255,255,.06);
 opacity:0;pointer-events:none;transition:opacity .3s}
.done .again{opacity:1;pointer-events:auto}
.foot{margin-top:1.6rem}
</style>
</head>
<body>
<div class="panel" id="p">
  <h1 class="h reveal">One click. <span class="hl">Four steps.</span></h1>
  <div class="main">
    <div class="view reveal d1" id="view">
      <video id="vA" muted playsinline loop preload="auto" poster="media/sing-cam-alone.jpg" src="media/sing-cam-alone.mp4"></video>
      <video id="vH" muted playsinline loop preload="auto" poster="media/sing-cam-heal.jpg" src="media/sing-cam-heal.mp4"></video>
      <span class="scanline"></span>
      <div class="read"><b><span id="fps">1.6</span><small>fps</small></b></div>
    </div>
    <div class="side reveal d2">
      <span class="pulse" id="pw"><button class="pbtn" id="go" data-g="Heal This Scene"><svg class="px" viewBox="0 0 3 3" aria-hidden="true"><path fill="currentColor" d="M1 0h1v1h1v1H2v1H1V2H0V1h1z"/></svg>Heal This Scene</button></span>
      <div class="steps">
        <div class="st"><b><em>1</em>Scan</b><div class="res" id="r1">140 slowdowns, ranked by cost</div></div>
        <div class="st"><b><em>2</em>Fix</b><div class="res" id="r2">12 fixes · renders unchanged</div></div>
        <div class="st"><b><em>3</em>Relief</b><div class="res" id="r3">Lighter in every shading mode</div></div>
        <div class="st"><b><em>4</em>Tune</b><div class="res" id="r4">Health 2 → 100 · 1.6 → 20 fps</div></div>
      </div>
      <button class="again" id="again">↻ Again</button>
    </div>
  </div>
  <p class="foot" id="foot">Singularity 100_0040 · Windows, RTX 4070 SUPER · Heal took 6 s, shown faster</p>
</div>
<script src="assets/fm.js"></script>
<script>
const FPS = {a: 1.64, b: 20.03};
const $ = id => document.getElementById(id);
const P = $('p'), vA = $('vA'), vH = $('vH');
const steps = [...document.querySelectorAll('.st')];
let running = false;
const wait = ms => new Promise(r => setTimeout(r, FM.reduce ? 0 : ms));
async function run() {
  if (running) return; running = true;
  $('go').disabled = true; $('pw').classList.remove('pulse');
  P.classList.remove('done'); $('fps').textContent = FPS.a.toFixed(1);
  steps.forEach(s => s.classList.remove('on', 'ok'));
  const durs = [1700, 1400, 900, 1100];
  for (let i = 0; i < 4; i++) {
    steps[i].classList.add('on');
    if (i === 0) P.classList.add('scanning');
    if (i === 3) { P.classList.add('done'); vH.currentTime = 0; vH.play().catch(() => {}); FM.count($('fps'), FPS.a, FPS.b, 1300, 1); }
    await wait(durs[i]);
    if (i === 0) P.classList.remove('scanning');
    steps[i].classList.replace('on', 'ok');
  }
  const r = $('view').getBoundingClientRect(); FM.burst(document.body, r.right - 70, r.bottom - 40, 12);
  running = false;
}
$('go').onclick = run;
$('again').onclick = () => { vH.pause(); run(); };
FM.onView(P, () => {
  P.classList.add('in'); vA.play().catch(() => {});
  setTimeout(() => { if (!running && !P.classList.contains('done')) run(); }, 3500);
});
</script>
</body>
</html>
